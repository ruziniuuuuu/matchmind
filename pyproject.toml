[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matchmind"
version = "0.1.0"
description = "Real-time explainable match intelligence for football broadcast"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-framework>=0.1.0",
  "agent-framework-openai>=0.1.0",
  "openai>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "azure-monitor-opentelemetry>=1.8.0",
  "azure-identity>=1.19.0",
  "agent-framework-foundry>=1.0.0",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/matchmind"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
